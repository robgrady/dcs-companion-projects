<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Mayday Matrix — DCS Emergency Card Builder</title>
<style>
:root{--bg:#11130f;--panel:#1b1e18;--panel2:#24281f;--ink:#f2f0df;--muted:#aaa994;--line:#424638;--amber:#f2b84b;--amber2:#6b4a16;--red:#ff695f;--green:#8fd48b;--focus:#fff2a8;--r:6px;--shadow:0 18px 50px rgba(0,0,0,.34);font-family:"Avenir Next",Avenir,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}html{background:var(--bg);color:var(--ink)}body{margin:0;min-height:100vh;background:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),var(--bg);background-size:100% 32px}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.skip{position:fixed;left:12px;top:-80px;z-index:99;background:var(--focus);color:#111;padding:12px}.skip:focus{top:12px}
header{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;padding:0 24px;position:sticky;top:0;background:rgba(17,19,15,.96);z-index:20}header h1{font-family:"Avenir Next Condensed","Arial Narrow",sans-serif;font-size:19px;letter-spacing:.12em;text-transform:uppercase;margin:0}.mark{width:30px;height:30px;border:2px solid var(--amber);display:grid;place-items:center;color:var(--amber);font-weight:800;transform:rotate(45deg)}.mark span{transform:rotate(-45deg)}.header-note{color:var(--muted);font-size:13px;border-left:1px solid var(--line);padding-left:20px}.header-actions{margin-left:auto;display:flex;gap:8px}
button,.file-btn{min-height:44px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel2);color:var(--ink);padding:9px 14px;font-weight:700;letter-spacing:.02em}.compact{min-height:38px;padding:7px 11px}.primary{background:var(--amber);color:#1a1409;border-color:var(--amber)}.danger{color:#ffd7d4;border-color:#75413e}.ghost{background:transparent}.icon-btn{width:44px;padding:0}.file-btn{display:inline-flex;align-items:center;justify-content:center;cursor:pointer}.file-btn input{position:absolute;opacity:0;pointer-events:none}button:hover,.file-btn:hover{border-color:var(--amber)}.primary:hover{background:#ffc968}
.shell{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:calc(100vh - 68px)}aside{border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:68px;height:calc(100vh - 68px);overflow:auto}.eyebrow{font-family:"Avenir Next Condensed","Arial Narrow",sans-serif;color:var(--amber);font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.side-title{display:flex;justify-content:space-between;align-items:center;margin:5px 0 14px}.side-title h2{font-size:22px;margin:0}.search{width:100%;height:46px;background:#0d0f0c;border:1px solid var(--line);border-radius:var(--r);color:var(--ink);padding:0 13px;margin-bottom:14px}.card-nav{display:grid;gap:7px}.nav-item{width:100%;text-align:left;background:transparent;border-color:transparent;padding:12px}.nav-item.active{background:var(--panel2);border-color:var(--line)}.nav-item b{display:block;font-size:14px}.nav-item span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.severity{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:7px;background:var(--green)}.severity.urgent{background:var(--red)}.side-bottom{border-top:1px solid var(--line);margin-top:20px;padding-top:16px;display:grid;gap:8px}.side-bottom button,.side-bottom .file-btn{width:100%}
main{padding:28px clamp(22px,4vw,62px) 80px;max-width:1200px}.statusline{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.1em;margin-bottom:24px}.statusline::before{content:"";width:30px;height:2px;background:var(--amber)}.procedure-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;border-bottom:1px solid var(--line);padding-bottom:24px}.procedure-head h2{font-family:"Avenir Next Condensed","Arial Narrow",sans-serif;font-size:clamp(36px,6vw,72px);line-height:.95;letter-spacing:-.025em;text-transform:uppercase;margin:8px 0 12px;max-width:760px}.procedure-head p{color:var(--muted);margin:0;max-width:700px;line-height:1.55}.head-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.progress-wrap{margin:24px 0 18px;display:flex;align-items:center;gap:15px}.progress-track{height:6px;background:var(--panel2);flex:1;overflow:hidden}.progress-bar{height:100%;width:0;background:var(--amber);transition:width .2s}.progress-label{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);min-width:82px;text-align:right}
.steps{list-style:none;padding:0;margin:0;counter-reset:step}.step{counter-increment:step;display:grid;grid-template-columns:58px 32px minmax(0,1fr) auto;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:17px 8px;min-height:74px}.step::before{content:counter(step,decimal-leading-zero);font-family:"Avenir Next Condensed","Arial Narrow",sans-serif;font-weight:800;color:var(--muted);font-size:18px}.step input[type=checkbox]{appearance:none;width:26px;height:26px;border:2px solid var(--muted);border-radius:3px;margin:0;display:grid;place-items:center}.step input:checked{background:var(--amber);border-color:var(--amber)}.step input:checked::after{content:"✓";color:#171108;font-weight:900}.step label{font-size:18px;line-height:1.3}.step.done label{text-decoration:line-through;color:var(--muted)}.step .tag{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--amber);border:1px solid var(--amber2);padding:5px 7px;border-radius:3px}.notes-block{margin-top:30px;display:grid;grid-template-columns:1fr 260px;gap:24px}.notes-block label{display:block;font-weight:800;margin-bottom:8px}.notes-block textarea{width:100%;min-height:130px;resize:vertical;background:#0d0f0c;color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:14px;line-height:1.5}.timer{border:1px solid var(--line);padding:16px;border-radius:var(--r);background:var(--panel)}.timer .time{font-family:"Avenir Next Condensed","Arial Narrow",sans-serif;font-size:42px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.04em;margin:5px 0 10px}.timer-actions{display:flex;gap:7px}
.empty{border:1px dashed var(--line);padding:44px;max-width:650px}.empty h2{font-size:38px;margin:8px 0}.empty p{color:var(--muted);line-height:1.6}
dialog{width:min(680px,calc(100vw - 28px));border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:var(--r);box-shadow:var(--shadow);padding:0}dialog::backdrop{background:rgba(0,0,0,.72)}.dialog-head{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.dialog-head h2{margin:0;font-size:22px}.dialog-body{padding:22px;display:grid;gap:16px}.dialog-body label{display:grid;gap:7px;font-weight:700;font-size:13px}.dialog-body input,.dialog-body textarea,.dialog-body select{background:#0d0f0c;border:1px solid var(--line);border-radius:var(--r);color:var(--ink);min-height:44px;padding:10px}.dialog-body textarea{min-height:80px;resize:vertical}.step-editor{display:grid;gap:8px}.edit-row{display:grid;grid-template-columns:1fr 110px 44px;gap:7px}.edit-row input,.edit-row select{width:100%}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;padding:0 22px 22px}
.alert-mode{position:fixed;inset:0;background:#15100d;z-index:60;display:none;padding:clamp(20px,4vw,60px);overflow:auto}.alert-mode.open{display:block}.alert-top{display:flex;align-items:center;gap:14px;border-bottom:2px solid var(--red);padding-bottom:18px}.alert-top h2{font-family:"Avenir Next Condensed","Arial Narrow",sans-serif;font-size:clamp(28px,5vw,58px);text-transform:uppercase;margin:0}.alert-top button{margin-left:auto}.alert-progress{color:#ffaaa4;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-top:24px}.alert-step{font-family:"Avenir Next Condensed","Arial Narrow",sans-serif;font-size:clamp(40px,8vw,92px);line-height:1.05;font-weight:800;max-width:1050px;margin:28px 0 40px;text-wrap:pretty}.alert-controls{display:flex;gap:12px;flex-wrap:wrap}.alert-controls button{font-size:18px;min-height:56px;padding:12px 20px}.alert-hint{color:var(--muted);margin-top:32px}
.toast{position:fixed;right:18px;bottom:18px;background:var(--ink);color:#141510;padding:12px 16px;border-radius:var(--r);font-weight:800;transform:translateY(100px);opacity:0;transition:.2s;z-index:100}.toast.show{transform:none;opacity:1}
@media(max-width:800px){header{padding:0 14px}.header-note{display:none}.header-actions .label{display:none}.shell{grid-template-columns:1fr}aside{position:relative;top:0;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:16px}.card-nav{grid-template-columns:repeat(2,minmax(0,1fr))}.side-bottom{grid-template-columns:repeat(3,1fr)}main{padding:24px 16px 70px}.procedure-head{grid-template-columns:1fr}.head-actions{justify-content:flex-start}.notes-block{grid-template-columns:1fr}.step{grid-template-columns:38px 28px minmax(0,1fr);gap:8px}.step .tag{grid-column:3}.side-bottom button,.side-bottom .file-btn{font-size:12px;padding:7px}.edit-row{grid-template-columns:1fr 90px 44px}}
@media(max-width:480px){.card-nav{grid-template-columns:1fr}.side-bottom{grid-template-columns:1fr}.procedure-head h2{font-size:40px}.step label{font-size:16px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
@media print{header,aside,.head-actions,.timer,.statusline,.toast{display:none!important}.shell{display:block}.procedure-head h2{font-size:32pt}main{padding:0;color:#000;max-width:none}.step{break-inside:avoid;border-color:#777}.step input{border-color:#000!important}.notes-block{display:block}.notes-block textarea{border-color:#777;color:#000;background:#fff}.progress-track{border:1px solid #777}.eyebrow,.step .tag{color:#000}.alert-mode{display:none!important}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to procedure</a>
<header><div class="mark" aria-hidden="true"><span>!</span></div><h1>Mayday Matrix</h1><span class="header-note">Offline emergency card builder · DCS World</span><div class="header-actions"><button class="ghost icon-btn" id="printBtn" title="Print kneeboard" aria-label="Print kneeboard">⌘P</button><button class="primary" id="alertBtn"><span class="label">Focus mode</span><span aria-hidden="true"> ↗</span></button></div></header>
<div class="shell">
<aside aria-label="Procedure library"><div class="eyebrow">Procedure library</div><div class="side-title"><h2>Your cards</h2><button class="compact primary" id="newBtn">+ New</button></div><label><span class="sr-only"></span><input class="search" id="search" type="search" placeholder="Filter procedures…" aria-label="Filter procedures"></label><nav class="card-nav" id="cardNav" aria-label="Emergency cards"></nav><div class="side-bottom"><button class="ghost" id="exportBtn">Export backup</button><label class="file-btn ghost">Import backup<input id="importInput" type="file" accept="application/json"></label><button class="ghost" id="restoreBtn">Restore defaults</button></div></aside>
<main id="main" tabindex="-1"><div id="workspace"></div></main>
</div>
<dialog id="editor"><form method="dialog" id="editorForm"><div class="dialog-head"><h2 id="editorTitle">New procedure</h2><button class="icon-btn ghost" value="cancel" aria-label="Close">×</button></div><div class="dialog-body"><label>Procedure name<input id="nameInput" required maxlength="60"></label><label>Purpose / trigger<textarea id="descInput" required maxlength="260"></textarea></label><label>Severity<select id="severityInput"><option value="urgent">Urgent</option><option value="routine">Abnormal / routine</option></select></label><div><div class="side-title"><strong>Steps</strong><button type="button" class="compact" id="addStepBtn">+ Step</button></div><div class="step-editor" id="stepEditor"></div></div></div><div class="dialog-actions"><button value="cancel">Cancel</button><button type="submit" value="default" class="primary" id="saveBtn">Save procedure</button></div></form></dialog>
<section class="alert-mode" id="alertMode" aria-modal="true" role="dialog" aria-labelledby="alertTitle"><div class="alert-top"><span class="eyebrow">Focus mode</span><h2 id="alertTitle"></h2><button id="closeAlert">Exit</button></div><div class="alert-progress" id="alertProgress"></div><div class="alert-step" id="alertStep"></div><div class="alert-controls"><button id="prevAlert">← Previous</button><button class="primary" id="doneAlert">Mark complete & next →</button></div><p class="alert-hint">Keyboard: ← previous · Space complete/next · Esc exit. Verify aircraft-specific switch actions against the current module manual.</p></section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';
const KEY='mayday-matrix-v1';
const defaults=[
{id:'aviate',name:'Aviate · Assess · Act',desc:'A module-neutral first response when something is wrong and the exact failure is not yet clear.',severity:'urgent',steps:[['Stabilize attitude, airspeed and flight path','memory'],['Separate from immediate terrain and threats','memory'],['Identify warnings, indications and aircraft response','check'],['Confirm the failure; avoid compounding switch actions','check'],['Choose: continue, divert, eject or controlled landing','decision'],['Declare emergency and pass intentions if able','comms']],notes:''},
{id:'battle-damage',name:'Battle Damage Triage',desc:'A disciplined post-hit scan before committing to the trip home.',severity:'urgent',steps:[['Fly the aircraft; establish a safe escape vector','memory'],['Check fire, engine, hydraulic and flight-control indications','check'],['Cross-check fuel quantity and rate of loss','check'],['Test control response with small, smooth inputs','check'],['Jettison only if required by the aircraft procedure','decision'],['Select nearest suitable recovery or ejection area','decision'],['Transmit position, damage and intentions','comms']],notes:''},
{id:'lost-comms',name:'Lost Communications',desc:'Organize the immediate actions and recovery plan after radio contact is lost.',severity:'routine',steps:[['Confirm correct radio, frequency, volume and transmit select','check'],['Try alternate radio and published frequencies','check'],['Check electrical power and circuit protection indications','check'],['Attempt contact through wingman, guard or data link','comms'],['Squawk or signal as briefed for the mission','comms'],['Follow the mission-specific no-radio recovery plan','decision']],notes:''},
{id:'divert',name:'Divert Decision',desc:'A compact gate for choosing a recovery field before fuel or damage removes the choice.',severity:'routine',steps:[['State usable fuel and current consumption trend','check'],['Identify nearest suitable runway and weather','check'],['Account for damage, stores, crosswind and runway length','decision'],['Set route, radio and navigation aids','check'],['Brief approach, missed approach and ejection minimums','decision'],['Tell flight or controller the divert intention','comms']],notes:''}
];
let state=load();let activeId=state.activeId&&state.cards.some(c=>c.id===state.activeId)?state.activeId:state.cards[0]?.id;let timer=null,timerStart=0,timerElapsed=0;let alertIndex=0;let editingId=null;
const $=s=>document.querySelector(s), nav=$('#cardNav'),work=$('#workspace'),search=$('#search'),editor=$('#editor'),stepEditor=$('#stepEditor'),toast=$('#toast');
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.cards))return x}catch(e){}return{cards:structuredClone(defaults),checks:{},activeId:defaults[0].id}}
function save(){state.activeId=activeId;localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function card(){return state.cards.find(c=>c.id===activeId)}
function checks(){return state.checks[activeId]||(state.checks[activeId]=[])}
function renderNav(){const q=search.value.trim().toLowerCase();const list=state.cards.filter(c=>(c.name+' '+c.desc).toLowerCase().includes(q));nav.innerHTML=list.map(c=>`<button class="nav-item ${c.id===activeId?'active':''}" data-id="${esc(c.id)}"><b><i class="severity ${c.severity==='urgent'?'urgent':''}"></i>${esc(c.name)}</b><span>${c.steps.length} steps · ${c.severity==='urgent'?'urgent':'abnormal'}</span></button>`).join('')||'<p style="color:var(--muted);padding:8px">No matching cards.</p>';nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{activeId=b.dataset.id;save();render()})}
function render(){renderNav();const c=card();if(!c){work.innerHTML=`<div class="empty"><div class="eyebrow">Library empty</div><h2>Build your first emergency card.</h2><p>Keep it aircraft-specific and verify switch actions against the current DCS module manual.</p><button class="primary" id="emptyNew">Create procedure</button></div>`;$('#emptyNew').onclick=()=>openEditor();return}const ck=checks();const done=ck.filter(Boolean).length;const pct=c.steps.length?Math.round(done/c.steps.length*100):0;work.innerHTML=`<div class="statusline">${c.severity==='urgent'?'Immediate / urgent':'Abnormal / deliberate'}</div><section class="procedure-head"><div><div class="eyebrow">Active procedure</div><h2>${esc(c.name)}</h2><p>${esc(c.desc)}</p></div><div class="head-actions"><button id="resetChecks">Reset</button><button id="editBtn">Edit</button><button class="danger" id="deleteBtn">Delete</button></div></section><div class="progress-wrap"><div class="progress-track" aria-label="Completion"><div class="progress-bar" style="width:${pct}%"></div></div><div class="progress-label">${done} / ${c.steps.length} complete</div></div><ol class="steps">${c.steps.map((s,i)=>`<li class="step ${ck[i]?'done':''}"><input id="s${i}" type="checkbox" data-i="${i}" ${ck[i]?'checked':''}><label for="s${i}">${esc(s[0])}</label><span class="tag">${esc(s[1])}</span></li>`).join('')}</ol><section class="notes-block"><div><label for="notes">Mission-specific notes</label><textarea id="notes" maxlength="1200" placeholder="Add frequencies, divert field, minimum fuel, or aircraft-specific cautions…">${esc(c.notes||'')}</textarea></div><div class="timer"><div class="eyebrow">Elapsed</div><div class="time" id="time">00:00</div><div class="timer-actions"><button class="compact primary" id="timerToggle">Start</button><button class="compact" id="timerReset">Reset</button></div></div></section>`;
work.querySelectorAll('input[type=checkbox]').forEach(x=>x.onchange=()=>{checks()[+x.dataset.i]=x.checked;save();render()});$('#notes').oninput=e=>{c.notes=e.target.value;save()};$('#resetChecks').onclick=()=>{state.checks[activeId]=[];save();render();say('Procedure reset')};$('#editBtn').onclick=()=>openEditor(c);$('#deleteBtn').onclick=()=>{if(confirm(`Delete “${c.name}”?`)){state.cards=state.cards.filter(x=>x.id!==c.id);delete state.checks[c.id];activeId=state.cards[0]?.id;save();render();say('Procedure deleted')}};$('#timerToggle').onclick=toggleTimer;$('#timerReset').onclick=resetTimer;updateTime()}
function addEditRow(text='',tag='check'){const row=document.createElement('div');row.className='edit-row';row.innerHTML=`<input aria-label="Step text" value="${esc(text)}" maxlength="140" required><select aria-label="Step type">${['memory','check','decision','comms'].map(x=>`<option ${x===tag?'selected':''}>${x}</option>`).join('')}</select><button type="button" class="icon-btn danger" aria-label="Remove step">×</button>`;row.querySelector('button').onclick=()=>row.remove();stepEditor.append(row)}
function openEditor(c=null){editingId=c?.id||null;$('#editorTitle').textContent=c?'Edit procedure':'New procedure';$('#nameInput').value=c?.name||'';$('#descInput').value=c?.desc||'';$('#severityInput').value=c?.severity||'urgent';stepEditor.innerHTML='';(c?.steps||[['','memory'],['','check'],['','decision']]).forEach(s=>addEditRow(...s));editor.showModal();$('#nameInput').focus()}
$('#editorForm').addEventListener('submit',e=>{e.preventDefault();const rows=[...stepEditor.children];if(!rows.length){say('Add at least one step');return}const obj={id:editingId||('card-'+Date.now()),name:$('#nameInput').value.trim(),desc:$('#descInput').value.trim(),severity:$('#severityInput').value,steps:rows.map(r=>[r.querySelector('input').value.trim(),r.querySelector('select').value]),notes:editingId?card()?.notes||'':''};if(editingId){const i=state.cards.findIndex(c=>c.id===editingId);state.cards[i]=obj}else state.cards.push(obj);activeId=obj.id;save();editor.close();render();say(editingId?'Procedure updated':'Procedure created')});
function updateTime(){const el=$('#time');if(!el)return;const total=timerElapsed+(timer?Date.now()-timerStart:0);const sec=Math.floor(total/1000),m=Math.floor(sec/60),s=sec%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');const b=$('#timerToggle');if(b)b.textContent=timer?'Pause':'Start'}
function toggleTimer(){if(timer){timerElapsed+=Date.now()-timerStart;clearInterval(timer);timer=null}else{timerStart=Date.now();timer=setInterval(updateTime,250)}updateTime()}
function resetTimer(){if(timer){clearInterval(timer);timer=null}timerElapsed=0;updateTime()}
function openAlert(){const c=card();if(!c)return;const ck=checks();alertIndex=Math.max(0,ck.findIndex(x=>!x));if(alertIndex<0)alertIndex=0;$('#alertMode').classList.add('open');document.body.style.overflow='hidden';drawAlert();$('#doneAlert').focus()}
function drawAlert(){const c=card(),ck=checks();$('#alertTitle').textContent=c.name;$('#alertProgress').textContent=`Step ${alertIndex+1} of ${c.steps.length} · ${ck.filter(Boolean).length} complete`;$('#alertStep').textContent=c.steps[alertIndex]?.[0]||'Procedure complete';$('#prevAlert').disabled=alertIndex===0;$('#doneAlert').textContent=alertIndex===c.steps.length-1?'Mark complete':'Mark complete & next →'}
function closeAlert(){ $('#alertMode').classList.remove('open');document.body.style.overflow='';render();$('#alertBtn').focus()}
function advance(){const c=card();checks()[alertIndex]=true;save();if(alertIndex<c.steps.length-1)alertIndex++;drawAlert()}
function say(x){toast.textContent=x;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}
function exportData(){const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mayday-matrix-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);say('Backup exported')}
$('#newBtn').onclick=()=>openEditor();$('#addStepBtn').onclick=()=>addEditRow();search.oninput=renderNav;$('#alertBtn').onclick=openAlert;$('#closeAlert').onclick=closeAlert;$('#prevAlert').onclick=()=>{if(alertIndex>0)alertIndex--;drawAlert()};$('#doneAlert').onclick=advance;$('#printBtn').onclick=()=>window.print();$('#exportBtn').onclick=exportData;$('#restoreBtn').onclick=()=>{if(confirm('Replace all cards with the four built-in defaults?')){state={cards:structuredClone(defaults),checks:{},activeId:defaults[0].id};activeId=defaults[0].id;save();render();say('Defaults restored')}};
$('#importInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.cards)||!x.cards.every(c=>c.name&&Array.isArray(c.steps)))throw Error();state={cards:x.cards,checks:x.checks||{},activeId:x.activeId};activeId=state.cards[0]?.id;save();render();say('Backup imported')}catch(_){alert('That file is not a valid Mayday Matrix backup.')}e.target.value=''};r.readAsText(f)};
document.addEventListener('keydown',e=>{if(!$('#alertMode').classList.contains('open'))return;if(e.key==='Escape'){e.preventDefault();closeAlert()}else if(e.key==='ArrowLeft'){e.preventDefault();if(alertIndex>0)alertIndex--;drawAlert()}else if(e.code==='Space'){e.preventDefault();advance()}});
render();
})();
</script>
</body>
</html>
